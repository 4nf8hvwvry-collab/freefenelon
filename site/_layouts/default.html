<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="no-referrer">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --fond: #fdfdfc; --texte: #1d1d1b; --lien: #0b57a4; --discret: #5f5f5a; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #161615; --texte: #ececea; --lien: #8ab8f0; --discret: #a3a39e; }
    }
    body { margin: 0 auto; max-width: 46rem; padding: 2rem 1rem; background: var(--fond); color: var(--texte);
           font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--lien); }
    footer { margin-top: 3rem; font-size: .9rem; color: var(--discret); }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>

  <footer>
    <p>Contenu placé dans le domaine public
      (<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.fr" rel="license">CC0 1.0</a>).
      Aucune autorisation ni attribution requise.</p>
  </footer>
</body>
</html>
