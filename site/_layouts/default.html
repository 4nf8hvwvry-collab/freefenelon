<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="no-referrer">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --fond: #fdfdfc; --texte: #1d1d1b; --lien: #0b57a4; --discret: #5f5f5a; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #161615; --texte: #ececea; --lien: #8ab8f0; --discret: #a3a39e; }
    }
    body { margin: 0 auto; max-width: 46rem; padding: 2rem 1rem; background: var(--fond); color: var(--texte);
           font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--lien); }
    img { max-width: 100%; height: auto; border: 1px solid var(--discret); }
    table { border-collapse: collapse; }
    th, td { text-align: left; padding: .25rem 1rem .25rem 0; border-bottom: 1px solid var(--discret); }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid var(--discret); }
    footer { margin-top: 3rem; font-size: .9rem; color: var(--discret); }
    .copie code { user-select: all; -webkit-user-select: all; font-size: 1.05em; padding: .15rem .4rem;
                  border: 1px solid var(--discret); border-radius: 4px; }
    .copie button { font: inherit; font-size: .9rem; padding: .15rem .6rem; cursor: pointer; }
    .acces-rapide { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.5rem; }
    .acces-rapide a { padding: .3rem .75rem; border: 1px solid var(--lien); border-radius: 999px;
                      text-decoration: none; font-size: .95rem; }
    .acces-rapide a:first-child { background: var(--lien); color: var(--fond); }
    html { scroll-behavior: smooth; }
    .modele { padding: .25rem 1.25rem; border: 1px solid var(--discret); border-radius: 6px; }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>

  <footer>
{% if page.reproduction %}
    <p>Document reproduit tel quel. Il reste la propriété de ses auteurs et n'est pas couvert par la licence CC0 du site.</p>
{% else %}
    <p>Contenu placé dans le domaine public
      (<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.fr" rel="license">CC0 1.0</a>).
      Aucune autorisation ni attribution requise.</p>
{% endif %}
  </footer>
  <script>
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-copie]');
      if (!b) return;
      var texte = document.getElementById(b.dataset.copie).innerText.trim();
      var libelle = b.textContent;
      function fait() { b.textContent = 'Copié ✓'; setTimeout(function () { b.textContent = libelle; }, 1500); }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texte).then(fait);
      } else {
        var t = document.createElement('textarea'); t.value = texte; document.body.appendChild(t);
        t.select(); document.execCommand('copy'); t.remove(); fait();
      }
    });
  </script>
</body>
</html>
